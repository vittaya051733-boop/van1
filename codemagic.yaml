workflows:
  van1-ios-testflight:
    name: VanTalad Merchant iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: van_apple_connect
    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        certificates:
          - vantalad_dist
        provisioning_profiles:
          - vantalad_merchant_profile
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Set up Xcode signing
        script: |
          keychain add-certificates
          xcode-project use-profiles
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
          cd ..
      - name: Verify app version
        script: |
          echo "Building $(grep '^version:' pubspec.yaml)"
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
