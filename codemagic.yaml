workflows:
  van1-ios-testflight:
    name: VanTalad Merchant iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: van_apple_connect
    environment:
      flutter: stable
      xcode: latest
      vars:
        BUNDLE_ID: com.vantalad.merchant
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
          cd ..
      - name: Fetch and apply current App Store signing files
        script: |
          set -euo pipefail
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/ios/Runner.xcodeproj" \
            --profile "$HOME/Library/MobileDevice/Provisioning Profiles/*.mobileprovision"
          echo "Resolved Runner Release signing:"
          xcodebuild \
            -project "$CM_BUILD_DIR/ios/Runner.xcodeproj" \
            -scheme Runner \
            -configuration Release \
            -showBuildSettings |
            grep -E "CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|DEVELOPMENT_TEAM|PROVISIONING_PROFILE_SPECIFIER"
      - name: Verify app version
        script: |
          echo "Building $(grep '^version:' pubspec.yaml)"
      - name: Build IPA
        script: |
          set -euo pipefail
          EXPORT_PLIST="/Users/builder/export_options.plist"
          if [ ! -f "$EXPORT_PLIST" ]; then
            echo "Codemagic export_options.plist not found — using repo fallback"
            EXPORT_PLIST="ios/ExportOptions.plist"
          fi
          echo "Using export plist: $EXPORT_PLIST"
          flutter build ipa --release --export-options-plist="$EXPORT_PLIST"
      - name: Verify IPA output
        script: |
          set -euo pipefail
          echo "Searching for IPA artifacts..."
          find build -name "*.ipa" -print -ls
          shopt -s nullglob
          ipas=(build/ios/ipa/*.ipa)
          if [ ${#ipas[@]} -eq 0 ]; then
            echo "ERROR: flutter build ipa finished but no .ipa file was produced."
            exit 1
          fi
          echo "IPA ready: ${ipas[*]}"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
