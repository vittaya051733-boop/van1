workflows:
  van1-ios-testflight:
    name: VanTalad Merchant iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: van_apple_connect
    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        certificates:
          - vantalad_dist
        provisioning_profiles:
          - vantalad_merchant_profile
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Set up Xcode signing
        script: |
          keychain add-certificates
          xcode-project use-profiles
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
          cd ..
      - name: Verify app version
        script: |
          echo "Building $(grep '^version:' pubspec.yaml)"
      - name: Build IPA
        script: |
          set -euo pipefail
          EXPORT_PLIST="/Users/builder/export_options.plist"
          if [ ! -f "$EXPORT_PLIST" ]; then
            echo "Codemagic export_options.plist not found — using repo fallback"
            EXPORT_PLIST="ios/ExportOptions.plist"
          fi
          echo "Using export plist: $EXPORT_PLIST"
          flutter build ipa --release --export-options-plist="$EXPORT_PLIST"
      - name: Verify IPA output
        script: |
          set -euo pipefail
          echo "Searching for IPA artifacts..."
          find build -name "*.ipa" -print -ls
          shopt -s nullglob
          ipas=(build/ios/ipa/*.ipa)
          if [ ${#ipas[@]} -eq 0 ]; then
            echo "ERROR: flutter build ipa finished but no .ipa file was produced."
            exit 1
          fi
          echo "IPA ready: ${ipas[*]}"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
