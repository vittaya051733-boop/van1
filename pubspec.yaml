name: van1
description: "Van 1 Flutter project."
publish_to: 'none'

version: 1.0.15+23

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  audioplayers: ^5.2.0
  cloud_functions: ^6.0.4
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  firebase_core: ^4.2.1
  cloud_firestore: ^6.1.0
  firebase_storage: ^13.0.4
  firebase_auth: ^6.1.2
  firebase_messaging: ^16.0.4
  flutter_cache_manager: ^3.3.2
  flutter_local_notifications: ^19.5.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^6.1.4
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.4
  crypto: ^3.0.6
  shared_preferences: ^2.2.3
  flutter_svg: ^2.0.10+1
  image_picker: ^1.2.0
  google_maps_flutter: ^2.13.1
  google_fonts: ^6.3.2
  firebase_app_check: ^0.4.1+2
  characters: ^1.4.0
  screenshot: ^3.0.0
  geolocator: ^14.0.1
  google_mlkit_commons: ^0.11.0
  google_mlkit_text_recognition: ^0.15.0
  http: ^1.1.0
  geocoding: ^4.0.0
  signature: ^6.3.0
  # printing: 5.13.1  # Temporarily disabled due to Android build conflict with lStar attribute
  pdf: ^3.11.3
  file_picker: ^10.3.7
  file_saver:
    path: local_packages/file_saver
  image: ^4.2.0
  flutter_image_compress: ^2.3.0
  intl: ^0.20.2
  promptpay_qrcode_generate: ^1.0.2
  qr_flutter: ^4.1.0
  blue_thermal_printer:
    path: local_packages/blue_thermal_printer
  mobile_scanner: ^7.1.3
  package_info_plus: ^9.0.0
  ota_update: 7.1.0
  url_launcher: ^6.3.0
  path: ^1.9.0
  agora_rtc_engine: ^6.5.3
  printing: ^5.14.2
  open_file: ^3.5.10
  better_player:
    path: local_packages/better_player
  video_compress: ^3.1.1
  video_thumbnail: ^0.5.3
  flutter_ringtone_manager: ^1.1.2
  permission_handler: ^12.0.1
  path_provider: ^2.1.4
  visibility_detector: ^0.4.0
  speech_to_text: ^7.4.0
  image_gallery_saver_plus: 4.0.1
  esc_pos_utils_plus: ^2.0.4
  thermal_printer_flutter:
    path: local_packages/thermal_printer_flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.1
  change_app_package_name: ^1.5.0

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/
    - assets/topping-pop-sound-245150.mp3
    - assets/ringback-incoming.m4a
    - assets/ringback-outgoing.m4a
    - shorebird.yaml
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_launcher_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_launcher_icon.png"
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/app_launcher_icon.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    image_path: "assets/app_launcher_icon.png"
  macos:
    generate: true
    image_path: "assets/app_launcher_icon.png"

dependency_overrides:
  sqflite_android: 2.4.1
  path_provider_foundation: 2.5.1
flutter_native_splash:
  color: "#ffffff"
  image: assets/app_logo.png
  android: true
  ios: true
